[project]
name = "personal-projects"
version = "0.1.0"
description = "Personal projects"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "parsel>=1.11.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.8",
    "pyright>=1.1.408",
]

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "PTH",    # flake8-use-pathlib
    "SIM",    # flake8-simplify
    "PERF",   # Perflint (performance)
    "PIE",    # flake8-pie (misc pythonic)
    "RET",    # flake8-return (consistent returns)
    "DTZ",    # flake8-datetimez (timezone-aware)
    "RUF",    # Ruff-specific rules
    "TRY",    # tryceratops (try/except best practices)
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "D203",   # Incompatible with D211
    "D213",   # Incompatible with D212
    "TRY003", # Long exception messages in raise
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# Pyright configuration
[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
