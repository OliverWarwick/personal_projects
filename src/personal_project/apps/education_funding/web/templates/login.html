{% extends "base.html" %}
{% block title %}Sign in — Education Financing{% endblock %}
{% block content %}
<section class="max-w-sm mx-auto px-6 pt-24 pb-16">
    <a href="/" class="text-sm hover:underline mb-10 inline-block" style="color: var(--text-muted);">&larr; Back</a>
    <h1 class="font-serif text-4xl mb-2">Sign in</h1>
    <p class="text-sm mb-8" style="color: var(--text-muted);">
        Continuing as
        <span class="capitalize font-medium" style="color: var(--text);">{{ role }}</span>.
    </p>

    {% if error %}
    <div class="mb-5 px-3.5 py-2.5 rounded-lg text-sm"
         style="background: var(--accent-soft); color: var(--accent-hover); border: 1px solid var(--accent);">
        {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/login" class="space-y-4">
        <input type="hidden" name="role" value="{{ role }}">
        <div>
            <label for="username" class="block text-sm mb-1.5 font-medium">Username</label>
            <input id="username" name="username" type="text" autocomplete="username"
                   autofocus required
                   class="w-full px-3.5 py-2.5 rounded-lg text-sm">
        </div>
        <div>
            <label for="password" class="block text-sm mb-1.5 font-medium">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password"
                   required
                   class="w-full px-3.5 py-2.5 rounded-lg text-sm">
        </div>
        <button type="submit"
                class="btn-primary w-full py-2.5 rounded-lg font-medium text-sm mt-2">
            Continue
        </button>
    </form>
</section>
{% endblock %}
