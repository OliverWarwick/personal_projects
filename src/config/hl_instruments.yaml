# Hargreaves Lansdown instrument URL map.
#
# HL has no public price API and EPIC-based URLs do not redirect, so each
# instrument's canonical page URL is recorded here once. The scraper at
# personal_project.clients.hl.prices fetches the URL, extracts the bid
# price from the inline "<span class='bid price-divide'>...p</span>" block,
# and caches the result on disk for 24 hours.
#
# To add an entry:
#   1. Search the instrument on https://www.hl.co.uk
#   2. Copy the canonical share/fund/ETF URL into `url:` below
#   3. (Optional) Note the SEDOL in `sedol:` for reference
#
# Prices on HL are quoted in pence — the parser returns Decimal pence.

instruments:
